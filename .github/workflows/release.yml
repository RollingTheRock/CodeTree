name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...
        env:
          CGO_ENABLED: "1"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64,  goos: linux,  goarch: amd64 }
          - { os: ubuntu-latest, target: linux-arm64,  goos: linux,  goarch: arm64, cc: aarch64-linux-gnu-gcc }
          - { os: macos-latest,  target: darwin-arm64, goos: darwin, goarch: arm64 }
          - { os: macos-latest,  target: darwin-amd64, goos: darwin, goarch: amd64 } # clang multiarch cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install arm64 cross compiler
        if: matrix.cc
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (native)
        if: ${{ !matrix.cc }}
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o ct ./cmd/ct

      - name: Build (cross)
        if: matrix.cc
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: go build -trimpath -ldflags "-s -w" -o ct ./cmd/ct

      - name: Package
        run: tar -czf ct-${{ matrix.target }}.tar.gz ct

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ct-${{ matrix.target }}.tar.gz
